<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamentos ALS Drywall</title>
<meta name="theme-color" content="#2a5ea8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orçamentos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app de uma coluna, mobile-first; folha A4 de papel para o PDF. Paleta: azul-petróleo do logo + cinza gesso. */
:root{
  --bg:#eef1f1; --surface:#ffffff; --fg:#1c2628; --muted:#5d6b6e; --line:#d5dcdd;
  --accent:#2a5ea8; --accent-fg:#ffffff; --accent-soft:#e1e9f6;
  --ok:#2f7d4a; --warn:#a86a12; --bad:#b0392f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121819; --surface:#1b2325; --fg:#e6eced; --muted:#93a2a5; --line:#2e3a3c;
  --accent:#7aa8ea; --accent-fg:#0c1626; --accent-soft:#1d2c44;
  --ok:#6cc38a; --warn:#e0a54a; --bad:#ef7b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1b2325; --fg:#e6eced; --muted:#93a2a5; --line:#2e3a3c;
  --accent:#7aa8ea; --accent-fg:#0c1626; --accent-soft:#1d2c44;
  --ok:#6cc38a; --warn:#e0a54a; --bad:#ef7b70; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--accent);color:var(--accent-fg);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
header.top h1{font:700 1.35rem/1 var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:inherit;font:600 .95rem var(--body);padding:8px 10px;border-radius:8px;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.14)}
main{padding-block:16px}
h2{font:700 1.25rem/1.1 var(--display);letter-spacing:.02em;margin:24px 0 10px;text-transform:uppercase;color:var(--muted)}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}
@media (max-width:480px){.g2.stack{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 1rem var(--body);border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:7px 11px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* lista */
.search{margin-bottom:12px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.qitem:hover{border-color:var(--accent)}
.qnum{font:700 .8rem var(--body);color:var(--muted);letter-spacing:.04em}
.qcli{font-weight:700;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qval{font:700 1.1rem var(--display);text-align:right;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.qmeta{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;border:1px solid currentColor;margin-left:6px}
.s-rascunho{color:var(--muted)}.s-enviado{color:var(--accent)}.s-aprovado{color:var(--ok)}.s-recusado{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.sample{font-size:.8rem;color:var(--warn);font-weight:600}
/* itens */
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.item .nums{display:grid;grid-template-columns:.8fr 1fr 1.3fr;gap:8px}
.item .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .sub{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums;margin-left:auto}
.idx{font:700 .78rem var(--body);color:var(--muted);letter-spacing:.05em}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px;font-weight:600;border-radius:12px;background:var(--accent-soft)}
.totalbar b{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.status-seg{display:flex;gap:6px;flex-wrap:wrap}
.status-seg button{flex:1;min-width:80px}
.status-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* barra fixa */
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{display:flex;gap:8px;padding-block:10px}
.actionbar .btn{flex:1}
/* catálogo */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:760px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.catitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.catitem .t{flex:1;min-width:0;font-size:.95rem}
.catitem .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:10px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--fg);border-radius:99px;padding:4px 4px 4px 12px;font-weight:600;font-size:.9rem}
.chip button{border:0;background:transparent;color:var(--muted);font:700 1rem var(--body);width:26px;height:26px;border-radius:99px;cursor:pointer}
.chip button:hover{color:var(--bad)}
.logoprev{width:96px;height:86px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
/* ===== folha do PDF (sempre clara) ===== */
#paperHost{position:fixed;left:-10000px;top:0}
.paper{width:794px;min-height:1123px;background:#fff;color:#1f2a2c;font:13px/1.45 var(--body);padding:48px 52px;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;gap:20px;border-bottom:3px solid #2a5ea8;padding-bottom:16px}
.p-head img{width:110px;height:auto}
.p-co{flex:1}
.p-co .n{font:700 28px/1 var(--display);letter-spacing:.03em;color:#2a5ea8;text-transform:uppercase}
.p-co .s{color:#5d6b6e;font-size:12.5px;margin-top:4px}
.p-doc{text-align:right}
.p-doc .t{font:700 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#5d6b6e}
.p-doc .num{font:700 30px/1 var(--display);color:#1f2a2c;margin-top:2px}
.p-doc .d{font-size:12px;color:#5d6b6e;margin-top:4px}
.p-cli{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:20px 0 18px;padding:14px 16px;background:#f0f4fa;border-radius:6px}
.p-cli .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6b7a7d;font-weight:700}
.p-cli .v{font-size:14px;font-weight:600}
.p-cli .full{grid-column:1/-1}
table.p-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.p-t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#2a5ea8;text-align:left;padding:8px 10px}
.p-t th.r,.p-t td.r{text-align:right;white-space:nowrap}
.p-t td{padding:10px;border-bottom:1px solid #dfe5e6;vertical-align:top}
.p-t td.desc{white-space:pre-wrap}
.p-t td.n{color:#6b7a7d;width:28px}
.p-tot{margin-left:auto;width:250px;margin-top:10px}
.p-tot div{display:flex;justify-content:space-between;align-items:baseline;padding:4px 10px;font-variant-numeric:tabular-nums;color:#5d6b6e}
.p-tot .g{border-top:2px solid #2a5ea8;background:#f0f4fa;padding:9px 10px;margin-top:4px;color:#1f2a2c}
.p-tot .g span:first-child{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#2a5ea8}
.p-tot .g span:last-child{font:700 17px var(--body)}
.p-sec{margin-top:20px}
.p-sec h4{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#2a5ea8;margin:0 0 6px}
.p-sec p{margin:0;white-space:pre-wrap}
.p-pay{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.p-foot{margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;font-size:11.5px;color:#6b7a7d}
.p-sign{width:260px;border-top:1px solid #1f2a2c;text-align:center;padding-top:6px;color:#1f2a2c;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <h1 id="title">Orçamentos</h1>
  <button class="iconbtn" id="btnBack" hidden>‹ Voltar</button>

</div></header>
<main class="wrap" id="view"></main>

<div id="paperHost"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtNum=n=>(Number(n)||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
function parseNum(s){
  if(typeof s==="number")return s;
  s=String(s||"").replace(/R\$|\s/g,"");
  if(!s)return 0;
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".");}
  else{const parts=s.split(".");
    if(parts.length>2){const dec=parts.pop();s=parts.join("")+"."+dec;}
    else if(parts.length===2&&parts[1].length===3){s=parts.join("");}}
  const n=parseFloat(s);return isFinite(n)?n:0;
}
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- dados ---------- */
const MSG_PAG_PADRAO="💳 *Formas de pagamento aceitas*\n\n*Cartões:*\n{cartoes}\n\n💠 *Para pagamento via Pix:*\n👤 Responsável: {responsavel}\n🔑 Chave: {chave}\n\nQualquer dúvida, é só chamar! 😊";
const UNITS_DEFAULT=["un","m","m²","m³","ambiente","lado","peça","placa","ponto","conjunto","verba","serviço","diária","hora","kg","saco","rolo"];
function unitLabel(un,qtd){un=String(un||"").trim();if(!un)return"";const n=parseNum(qtd);
  if(n===1||un.length<3||/[²³.]/.test(un))return un;
  if(/[aeiouáéíóúâêô]$/i.test(un))return un+"s";if(/[rz]$/i.test(un))return un+"es";return un;}

  settings:{empresa:"ALS Drywall",subtitulo:"Drywall, forros e gesso",telefone:"(41) 99628-7888",email:"",cidade:"Curitiba",uf:"PR",

    desconto:0,obs:"Sem pintura.",pagamento:"50% na aprovação e 50% na entrega do serviço.",status:"rascunho",updatedAt:Date.now()}]
}}
let db;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){db=JSON.parse(raw);const d=defaults();db.settings=Object.assign(d.settings,db.settings||{});db.catalog=db.catalog||[];db.quotes=db.quotes||[];db.nextNumber=db.nextNumber||109;if(!Array.isArray(db.units))db.units=UNITS_DEFAULT.slice();return;}}catch(e){}
  db=defaults();}
let storageOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOk=true;}catch(e){storageOk=false;toast("Não consegui salvar neste navegador. Faça um backup.");}}
load();

const subtotal=q=>q.itens.reduce((s,i)=>s+parseNum(i.qtd)*parseNum(i.valor),0);
const total=q=>Math.max(0,subtotal(q)-parseNum(q.desconto));

/* ---------- utilidades de UI ---------- */
let toastT;
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function setBar(html){$("#barInner").innerHTML=html;$("#bar").hidden=!html;}
function setHeader(title,back){$("#title").textContent=title;$("#btnBack").hidden=!back;$("#btnSettings").hidden=!!back;}

/* ---------- rotas simples ---------- */
let current=null; // orçamento em edição
function go(view,arg){window.scrollTo(0,0);
  if(view==="list")renderList();else if(view==="edit")renderEdit(arg);else if(view==="settings")renderSettings();}
$("#btnBack").onclick=()=>{if(current)commit();go("list")};
$("#btnSettings").onclick=()=>go("settings");

/* ---------- LISTA ---------- */
let filtro="";
function renderList(){
  current=null;setHeader(db.settings.empresa||"Orçamentos",false);
  const qs=[...db.quotes].sort((a,b)=>b.numero-a.numero).filter(q=>!filtro||(q.cliente+" "+q.numero+" "+q.cidade).toLowerCase().includes(filtro.toLowerCase()));
  $("#view").innerHTML=`
   <h2>Orçamentos</h2>
   ${db.quotes.length>3?`<input class="search" id="busca" type="search" placeholder="Buscar por cliente ou número" value="${esc(filtro)}">`:""}
   <div class="qlist">${qs.length?qs.map(q=>`
     <button class="qitem" data-id="${q.id}">
       <span class="qnum">Nº ${q.numero} · ${fmtDate(q.data)}<span class="pill s-${q.status}">${q.status}</span>${q.exemplo?` <span class="sample">· exemplo</span>`:""}</span>
       <span class="qval">${brl(total(q))}</span>
       <span class="qcli">${esc(q.cliente||"Sem nome")}</span>
       <span class="qmeta">${q.itens.length} ${q.itens.length===1?"item":"itens"}${q.cidade?" · "+esc(q.cidade):""}</span>
     </button>`).join(""):`<div class="empty">Nenhum orçamento ainda.<br>Toque em <b>Novo orçamento</b> para começar.</div>`}</div>
   ${!storageOk?`<p class="hint" style="color:var(--bad)">Este navegador não está guardando os dados. Abra pelo link normal (fora da aba anônima).</p>`:""}`;
  document.querySelectorAll(".qitem").forEach(b=>b.onclick=()=>go("edit",b.dataset.id));
  const bu=$("#busca");if(bu){bu.oninput=e=>{filtro=e.target.value;const pos=e.target.selectionStart;renderList();const n=$("#busca");n.focus();n.setSelectionRange(pos,pos);};}
  setBar(`<button class="btn primary" id="bNovo">+ Novo orçamento</button>`);
  $("#bNovo").onclick=()=>{const s=db.settings;const q={id:uid(),numero:db.nextNumber++,data:today(),validadeDias:s.validade||15,cliente:"",telefone:"",endereco:"",cidade:s.cidade,uf:s.uf,
    itens:[{desc:"",qtd:1,un:"",valor:""}],desconto:0,obs:s.obsPadrao||"",pagamento:s.pagPadrao||"",status:"rascunho",updatedAt:Date.now()};
    db.quotes.push(q);save();go("edit",q.id);};
}

/* ---------- EDITOR ---------- */
function renderEdit(id){
  const q=db.quotes.find(x=>x.id===id);if(!q)return go("list");

let commitT;
function commit(){if(!current)return;current.updatedAt=Date.now();clearTimeout(commitT);commitT=setTimeout(save,250);}
function renderItems(q){
  const box=$("#items");
  box.innerHTML=q.itens.map((it,i)=>`
    <div class="item" data-i="${i}">
      <div class="row"><span class="idx">SERVIÇO ${i+1}</span><span class="spacer"></span>
        <button class="btn small ghost" data-act="save" title="Guardar nos serviços salvos">Salvar modelo</button>
        <button class="btn small ghost danger" data-act="rm" aria-label="Remover serviço ${i+1}">Remover</button></div>
      <label>Descrição<textarea data-k="desc" rows="2" placeholder="Ex.: Material e instalação de forro de gesso">${esc(it.desc)}</textarea></label>
      <div class="nums">
        <label>Qtd.<input data-k="qtd" inputmode="decimal" value="${esc(it.qtd===""?"":fmtNum(parseNum(it.qtd)))}"></label>
        <label>Unidade<select data-u>${unitOptions(it.un)}</select></label>
        <label>Valor unit. (R$)<input data-k="valor" inputmode="decimal" value="${it.valor===""?"":esc(fmtNum(parseNum(it.valor)))}" placeholder="0,00"></label>
      </div>
      <div class="newunit row" hidden><input data-nu placeholder="Nome da nova unidade (ex.: m linear)" style="flex:1;min-width:160px"><button class="btn small primary" data-act="nuok">Adicionar</button><button class="btn small ghost" data-act="nuno">Cancelar</button></div>
      <div class="foot"><span class="qmeta">Total do item</span><span class="sub">${brl(parseNum(it.qtd)*parseNum(it.valor))}</span></div>
    </div>`).join("")||`<div class="empty card">Nenhum serviço. Adicione o primeiro abaixo.</div>`;
  box.querySelectorAll(".item").forEach(el=>{const i=+el.dataset.i;
    el.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{q.itens[i][inp.dataset.k]=inp.value;
      el.querySelector(".sub").textContent=brl(parseNum(q.itens[i].qtd)*parseNum(q.itens[i].valor));$("#tot").textContent=brl(total(q));commit();}));
    const sel=el.querySelector("[data-u]"),nu=el.querySelector(".newunit"),nuIn=el.querySelector("[data-nu]");
    sel.addEventListener("change",()=>{if(sel.value==="__new"){nu.hidden=false;nuIn.value="";nuIn.focus();sel.value=q.itens[i].un||"";return;}q.itens[i].un=sel.value;commit();});
    const addUnit=()=>{const v=nuIn.value.trim();if(!v)return toast("Digite o nome da unidade");
      if(!db.units.some(u=>u.toLowerCase()===v.toLowerCase()))db.units.push(v);q.itens[i].un=db.units.find(u=>u.toLowerCase()===v.toLowerCase());commit();save();renderItems(q);toast("Unidade “"+v+"” adicionada à lista");};
    el.querySelector('[data-act="nuok"]').onclick=addUnit;nuIn.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addUnit();}});
    el.querySelector('[data-act="nuno"]').onclick=()=>{nu.hidden=true;};
    el.querySelector('[data-act="rm"]').onclick=()=>{q.itens.splice(i,1);commit();renderItems(q);$("#tot").textContent=brl(total(q));};
    el.querySelector('[data-act="save"]').onclick=()=>{const it=q.itens[i];if(!it.desc.trim())return toast("Escreva a descrição primeiro");
      const ex=db.catalog.find(c=>c.desc.trim().toLowerCase()===it.desc.trim().toLowerCase());
      if(ex){ex.un=it.un;ex.valor=parseNum(it.valor);}else db.catalog.push({desc:it.desc.trim(),un:it.un,valor:parseNum(it.valor)});save();toast("Serviço salvo para usar depois");};
  });
}
function unitOptions(cur){const list=db.units.slice();if(cur&&!list.includes(cur))list.unshift(cur);
  return `<option value="">—</option>`+list.map(u=>`<option value="${esc(u)}"${u===cur?" selected":""}>${esc(u)}</option>`).join("")+`<option value="__new">+ Nova unidade…</option>`;}
function openCatalog(q){
  const s=document.createElement("div");s.className="sheet";
  const draw=()=>{s.innerHTML=`<div class="panel" role="dialog" aria-label="Serviços salvos">
    <div class="row"><h2 style="margin:0">Serviços salvos</h2><span class="spacer"></span><button class="btn small" id="cClose">Fechar</button></div>
    ${db.catalog.length?db.catalog.map((c,i)=>`<div class="catitem"><span class="t">${esc(c.desc)}</span><span class="p">${brl(c.valor)}${c.un?" / "+esc(c.un):""}</span>
      <button class="btn small primary" data-add="${i}">Usar</button><button class="btn small ghost danger" data-del="${i}" aria-label="Apagar modelo">×</button></div>`).join("")
      :`<p class="empty">Nenhum serviço salvo ainda. Use “Salvar modelo” em um serviço para guardá-lo aqui.</p>`}</div>`;
    s.querySelector("#cClose").onclick=()=>s.remove();
    s.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const c=db.catalog[+b.dataset.add];
      const last=q.itens[q.itens.length-1];const novo={desc:c.desc,qtd:1,un:c.un||"",valor:c.valor};
      if(last&&!last.desc&&!parseNum(last.valor))q.itens[q.itens.length-1]=novo;else q.itens.push(novo);
      commit();renderItems(q);$("#tot").textContent=brl(total(q));s.remove();toast("Serviço adicionado");});
    s.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{db.catalog.splice(+b.dataset.del,1);save();draw();});
  };
  s.onclick=e=>{if(e.target===s)s.remove();};draw();document.body.appendChild(s);
}
function payMessage(){const s=db.settings;
  return (s.msgPagamento||MSG_PAG_PADRAO).replace(/\{cartoes\}/g,s.bandeiras||"—").replace(/\{responsavel\}/g,s.pixTitular||"—").replace(/\{chave\}/g,s.pix||"—");}
function copyText(t){const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();toast(ok?"Texto copiado":"Não consegui copiar neste aparelho");};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Texto copiado. É só colar no WhatsApp."),fb);else fb();}
function textSummary(q){const s=db.settings;
  let t=`*${s.empresa}* – Orçamento nº ${q.numero}\nCliente: ${q.cliente}\nData: ${fmtDate(q.data)}\n\n`;
  q.itens.filter(i=>i.desc||parseNum(i.valor)).forEach((i,n)=>{t+=`${n+1}. ${i.desc}\n   ${fmtNum(parseNum(i.qtd))} ${unitLabel(i.un,i.qtd)} × ${brl(parseNum(i.valor))} = ${brl(parseNum(i.qtd)*parseNum(i.valor))}\n`;});
  if(parseNum(q.desconto))t+=`\nDesconto: -${brl(parseNum(q.desconto))}`;
  t+=`\n*Total: ${brl(total(q))}*\n`;
  if(q.pagamento)t+=`\nPagamento: ${q.pagamento}`;
  if(s.pix)t+=`\nPix: ${s.pix}${s.pixTitular?" ("+s.pixTitular+")":""}`;
  if(q.obs)t+=`\nObs.: ${q.obs}`;
  t+=`\n\n${s.telefone}`;return t;}

  let validade="";if(q.data&&parseNum(q.validadeDias)){const d=new Date(q.data+"T12:00:00");d.setDate(d.getDate()+parseNum(q.validadeDias));validade=d.toLocaleDateString("pt-BR");}

     <div class="p-doc"><div class="t">Orçamento</div><div class="num">Nº ${q.numero}</div><div class="d">Material e mão de obra<br>${fmtDate(q.data)}</div></div>

   </div>

   <tbody>${itens.map((i,n)=>`<tr><td class="n">${n+1}</td><td class="desc">${esc(i.desc)}</td><td class="r">${fmtNum(parseNum(i.qtd))} ${esc(unitLabel(i.un,i.qtd))}</td><td class="r">${brl(parseNum(i.valor))}</td><td class="r"><b>${brl(parseNum(i.qtd)*parseNum(i.valor))}</b></td></tr>`).join("")}</tbody></table>
   <div class="p-tot">${desc?`<div><span>Subtotal</span><span>${brl(sub)}</span></div><div><span>Desconto</span><span>− ${brl(desc)}</span></div>`:""}

     <div><h4>Forma de pagamento</h4><p>${esc(q.pagamento)||"A combinar"}${s.bandeiras?`\nCartões aceitos: ${esc(s.bandeiras)}`:""}</p></div>
     ${s.pix?`<div><h4>Pix</h4><p><b>${esc(s.pix)}</b>${s.pixTitular?"\n"+esc(s.pixTitular):""}</p></div>`:"<div></div>"}
   </div>
   <div class="p-foot"><span>${esc(s.empresa)} · ${esc(s.telefone)}</span><div class="p-sign">De acordo – ${esc(q.cliente)||"Cliente"}</div></div>
  </div>`;}
async function makePdf(q,mode){
  commit();save();
  if(!window.html2canvas||!window.jspdf){toast("Sem internet para gerar o PDF agora. Tente de novo em instantes.");return;}
  const btns=document.querySelectorAll("#barInner .btn");btns.forEach(b=>b.disabled=true);
  const host=$("#paperHost");host.innerHTML=paperHTML(q);
  const nome=`Orcamento-${q.numero}-${(q.cliente||"cliente").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-")}.pdf`;
  try{
    await (document.fonts&&document.fonts.ready);
    const el=host.firstElementChild;
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,
      scrollX:-window.scrollX,scrollY:-window.scrollY,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight,
      onclone:doc=>{const h=doc.getElementById("paperHost");h.style.left="0px";h.style.top="0px";}});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    const pw=210,ph=297,imgH=canvas.height*pw/canvas.width,img=canvas.toDataURL("image/jpeg",.95);
    let y=0;pdf.addImage(img,"JPEG",0,0,pw,imgH);
    while(imgH-(y+=ph)>1){pdf.addPage();pdf.addImage(img,"JPEG",0,-y,pw,imgH);}
    const blob=pdf.output("blob");
    const file=new File([blob],nome,{type:"application/pdf"});
    if(mode==="share"&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:`Orçamento nº ${q.numero}`});if(q.status==="rascunho"){q.status="enviado";save();renderEdit(q.id);}}
      catch(e){if(e.name!=="AbortError")download(blob,nome);}
    }else if(mode==="open"){const url=URL.createObjectURL(blob);const w=window.open(url,"_blank");if(!w)download(blob,nome);}
    else{download(blob,nome);toast("PDF salvo. Agora é só anexar no WhatsApp.");}
  }catch(e){console.error(e);toast("Não consegui gerar o PDF. Tente novamente.");}
  finally{host.innerHTML="";btns.forEach(b=>b.disabled=false);}
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}

$("#fileLogo").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const sc=Math.min(1,400/Math.max(img.width,img.height));
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    db.settings.logo=c.toDataURL("image/jpeg",.9);save();renderSettings();toast("Logo atualizado");};img.src=r.result;};r.readAsDataURL(file);e.target.value="";};
$("#fileImport").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.quotes||!d.settings)throw 0;db=d;save();toast("Backup restaurado");go("list");}catch(err){toast("Esse arquivo não é um backup válido.");}};r.readAsText(file);e.target.value="";};

go("list");
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
})();
</script>
</body>
</html>
